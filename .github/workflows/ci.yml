name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race matters: the store types guard shared state with sync.RWMutex
      # and every handler runs concurrently under net/http.
      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: go build -o /tmp/kypassword-server ./cmd/server

  frontend:
    name: Frontend (Vite/React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: npm test
        run: npm test
      # `build` is `tsc && vite build`, so this is the typecheck gate too.
      - name: npm run build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: kypassword-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Hand the exact image the checks above ran against to the publish job,
      # so what gets pushed is what was tested, never a second build.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          docker save kypassword-server:ci | gzip > tested-image.tar.gz
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-image
          path: tested-image.tar.gz
          retention-days: 1

  security:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  # Publishes the image CI tested: only for pushes to master, only
  # after every job passed, and with no checkout and no build of its own, so
  # the pushed bytes are the tested bytes. A pull request from a fork must
  # never reach this job or write a package.
  publish:
    needs: [backend, frontend, docker, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # One publish at a time, never cancelled: a run that has pushed :<sha> must
    # be allowed to finish attesting it. Ordering is handled below, not here.
    concurrency:
      group: publish-master
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-image
      - run: docker load < tested-image.tar.gz

      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Name derived, not spelled out: GITHUB_TOKEN can only write the owning
      # account's namespace, and registries reject a mixed-case name. Only the
      # commit tag is pushed here; it is what lets an operator pin a known-good
      # image and roll back to it. :latest moves last, after the attestation
      # verifies.
      - id: push
        run: |
          set -euo pipefail
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag kypassword-server:ci "$name:$GITHUB_SHA"
          docker push "$name:$GITHUB_SHA"
          digest="$(docker buildx imagetools inspect "$name:$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Binds the pushed manifest to this run and commit. Verifying it here, the
      # way an operator would, proves the attestation is usable and not just present.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.push.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$NAME@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"

      # :latest advances only to an image whose provenance verified above, and
      # only to the current tip of master: two runs are serialised but not
      # ordered, so a slower run for an older commit would otherwise move
      # :latest backwards. Everything above is unconditional, so an older
      # commit stays pinnable by :<sha> and verifiable.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.push.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "Published \`$NAME@$DIGEST\` as \`:$GITHUB_SHA\` only: master has moved on to $tip" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker tag kypassword-server:ci "$NAME:latest"
          docker push "$NAME:latest"
          echo "Published \`$NAME@$DIGEST\` as \`:latest\` and \`:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

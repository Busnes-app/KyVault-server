name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A superseded PR run is cancelled. A push to master is not: cancelling it mid-
# publish could leave a :<sha> tag in GHCR with no attestation behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: image and attestation coordinates match this repository
        run: |
          set -euo pipefail
          img="ghcr.io/${GITHUB_REPOSITORY,,}"
          ident="https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/master"
          # the retired owner is claimable by anyone. It may appear only in the README's two warning
          # lines, or in a file that opens with the "Retired owner:" annotation (a dated record), and
          # never as a fetchable coordinate or a fetch instruction, annotated or not
          mapfile -t all < <(git ls-files 'docker-compose*.yml' '*.md')
          bad=$(grep -in 'busness-app' README.md | grep -vE '^[0-9]+:## Upgrading from ghcr\.io/busness-app$' | grep -vE '^[0-9]+:The GitHub organisation was renamed on 2026-09-16 and the image now lives at ' || true); [ -z "$bad" ] || { echo "retired owner outside the README warning lines:"; echo "$bad"; exit 1; }
          bad=$(grep -il 'busness-app' "${all[@]}" | grep -vx README.md | xargs -r grep -L 'Retired owner:' || true); [ -z "$bad" ] || { echo "retired owner named without the retirement annotation in:"; echo "$bad"; exit 1; }
          bad=$(grep -nE 'github\.com/busness-app|(go get|go mod edit -replace|^module )[^\n]*busness-app' -i "${all[@]}" || true); [ -z "$bad" ] || { echo "fetchable coordinate under the retired owner:"; echo "$bad"; exit 1; }
          # operator-facing files: every compose file and every non-historical doc
          mapfile -t files < <(printf '%s\n' "${all[@]}" | grep -v '^docs/superpowers/')
          [ "${#files[@]}" -ge 2 ] || { echo "no compose/doc files found"; exit 1; }
          for f in "${files[@]}"; do [ -r "$f" ] || { echo "$f is not readable"; exit 1; }; done
          # the image key itself, not just some occurrence in a comment
          grep -E '^\s*image:' docker-compose.yml | grep -qF "$img" || { echo "image: does not default to $img"; exit 1; }
          # every image coordinate, in either spelling of any org; the retired namespace only as the
          # bare name on the README warning lines checked above, never as an image
          seen=$(grep -ohE 'ghcr\.io/[A-Za-z0-9._/-]+' "${files[@]}" | sort -u || true)
          [ -n "$seen" ] || { echo "no image coordinate found"; exit 1; }
          bad=$(printf '%s\n' "$seen" | grep -vxF -e "$img" -e "ghcr.io/busness-app" || true); [ -z "$bad" ] || { echo "image coordinate outside $img:"; echo "$bad"; exit 1; }
          # the pin block itself must carry both flags; a value elsewhere does not excuse it
          for f in docker-compose.yml $( [ -f docs/RESTORE.md ] && echo docs/RESTORE.md ); do
            if [ "$f" = docker-compose.yml ] || grep -qE -- '--(repo|cert-identity) ' "$f"; then
              grep -q -- '--repo ' "$f" && grep -q -- '--cert-identity ' "$f" || { echo "$f lacks --repo or --cert-identity"; exit 1; }
            fi
          done
          # every --repo and the whole of every --cert-identity (workflow file and ref included),
          # collected by option name so a malformed value cannot slip past the check
          repos=$(grep -ohE -- '--repo [^ ]+' "${files[@]}" | sed 's/^--repo //' | sort -u || true)
          [ -n "$repos" ] || { echo "no --repo found"; exit 1; }
          bad=$(printf '%s\n' "$repos" | grep -vxF "$GITHUB_REPOSITORY" || true); [ -z "$bad" ] || { echo "--repo outside $GITHUB_REPOSITORY:"; echo "$bad"; exit 1; }
          certs=$(grep -ohE -- '--cert-identity [^ ]+' "${files[@]}" | sed 's/^--cert-identity //' | sort -u || true)
          [ -n "$certs" ] || { echo "no --cert-identity found"; exit 1; }
          bad=$(printf '%s\n' "$certs" | grep -vxF "$ident" || true); [ -z "$bad" ] || { echo "--cert-identity outside $ident:"; echo "$bad"; exit 1; }
          # README may only point at docs that exist
          (grep -ohE 'docs/[A-Za-z0-9._/-]+\.md' README.md || true) | sort -u | xargs -r -I{} test -f {}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race matters: the store types guard shared state with sync.RWMutex
      # and every handler runs concurrently under net/http.
      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: go build -o /tmp/kyvault-server ./cmd/server

  frontend:
    name: Frontend (Vite/React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: npm test
        run: npm test
      # `build` is `tsc && vite build`, so this is the typecheck gate too.
      - name: npm run build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: kyvault-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Hand the exact image the checks above ran against to the publish job,
      # so what gets pushed is what was tested, never a second build.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          docker save kyvault-server:ci | gzip > tested-image.tar.gz
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-image
          path: tested-image.tar.gz
          retention-days: 1

  security:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  # Publishes the image CI tested: only for pushes to master, only
  # after every job passed, and with no checkout and no build of its own, so
  # the pushed bytes are the tested bytes. A pull request from a fork must
  # never reach this job or write a package.
  publish:
    needs: [backend, frontend, docker, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # No concurrency group here on purpose: GitHub cancels a *pending* job when a
    # newer one queues into the same group, which would leave that commit with no
    # :<sha> image and no attestation. Every commit whose run reaches this job
    # gets both; a run superseded before it starts publishes nothing.
    outputs:
      name: ${{ steps.push.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-image
      - run: docker load < tested-image.tar.gz

      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Name derived, not spelled out: GITHUB_TOKEN can only write the owning
      # account's namespace, and registries reject a mixed-case name. Only the
      # commit tag is pushed here; it is what lets an operator pin a known-good
      # image and roll back to it. :latest moves in the promote job, after the
      # attestation verifies.
      - id: push
        run: |
          set -euo pipefail
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag kyvault-server:ci "$name:$GITHUB_SHA"
          docker push "$name:$GITHUB_SHA"
          digest="$(docker buildx imagetools inspect "$name:$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Binds the pushed manifest to this run and commit. Verifying it here, the
      # way an operator would, proves the attestation is usable and not just present.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.push.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$NAME@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/master"


  # :latest advances only to an image whose provenance verified above, and only
  # to the current tip of master. Serialised here, not in publish: a pending
  # promote cancelled by a newer one queuing is harmless, since a newer run
  # existing is exactly what makes this commit no longer the tip. Promotion is
  # by digest and the result is asserted, so :latest is the attested manifest.
  promote:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: promote-master
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ needs.publish.outputs.name }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "Published \`$NAME@$DIGEST\` as \`:$GITHUB_SHA\` only: master has moved on to $tip" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # --prefer-index=false: with the default, buildx wraps a single manifest in a
          # new index whose digest the attestation does not cover. Then prove it, the
          # way an operator would, on the tag they actually deploy.
          docker buildx imagetools create --prefer-index=false --tag "$NAME:latest" "$NAME@$DIGEST"
          latest="$(docker buildx imagetools inspect "$NAME:latest" --format '{{.Manifest.Digest}}')"
          if [ "$latest" != "$DIGEST" ]; then
            echo "::error:::latest resolves to $latest, attested digest is $DIGEST" >&2
            exit 1
          fi
          gh attestation verify "oci://$NAME:latest" --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/master"
          echo "Published \`$NAME@$DIGEST\` as \`:latest\` and \`:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
